# The 300-epoch shipped cell, regenerated at 1 thread.
# Exists because data/processed/rigor/long_horizon/ does not reproduce
# at any thread count (docs/REVIEW_RESPONSE.md A3). n_epochs is 300 so
# epochs_per_gen = 60, matching a 300-epoch design.
population:
  n: 1000
  seed: 42
  admissible_fraction: 0.02
  taste_sigma: 0.5
  intent_beta_a: 2.0
  intent_beta_b: 2.0
  values_beta_a: 2.0
  values_beta_b: 2.0
  community_prob: 0.5
  traits:
    status:
      dist: lognormal
      mean: 0.0
      std: 0.8
    attractiveness:
      dist: normal
      mean: 0.5
      std: 0.15
    sociability:
      dist: normal
      mean: 0.5
      std: 0.15
    age:
      dist: normal
      mean: 30.0
      std: 6.0
hypergamy:
  delta: 0.5
  alpha: 1.0
  beta: 2.0
  gamma: 0.3
  lambda: 1.5
  shock_scale: 1.5
  signal_cost: 0.0
environment_b:
  size_fraction: 0.5
  values_min: 0.3
  signal_cost: 0.25
  defection_penalty: 0.5
  sigma_0: 1.0
  sigma_alpha: 0.5
  sigma_beta: 0.5
  partner_loss: 1.0
ncf:
  embed_dim: 64
  mlp_layers:
  - 128
  - 64
  - 32
  lr: 0.001
  l2_reg: 1.0e-05
  pos_weight: 4.0
  top_k: 20
  n_negatives: 4
  num_threads: 1
simulation:
  n_epochs: 300
  bayesian_eta: 0.1
  n_generations: 5
  turnover_fraction: 0.2
  status_drift: 0.0
output:
  dir: data/processed/
  save_every: 10

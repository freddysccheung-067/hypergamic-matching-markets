population:
  n: 1000
  seed: 42
  # Share of candidates an agent finds admissible at epoch 0. θ is calibrated per
  # agent as the (1 - admissible_fraction) quantile of that agent's own utilities,
  # so this is a target, not a cutoff — see docs/INTERFACES.md §2 and THEORY.md §3.
  admissible_fraction: 0.2
  # Spread of the per-agent taste multipliers (THEORY.md §2.3). Each of
  # m_alpha, m_beta, m_gamma is lognormal(-sigma^2/2, sigma) with mean 1, so this
  # is a coefficient of variation. 0 disables heterogeneity and reproduces the
  # homogeneous population bit for bit. There is no empirical anchor for this
  # number: results are reported as a function of it, never at one setting.
  taste_sigma: 0.5
  # Institutional state (THEORY.md §10.1). Beta shapes for the two continuous
  # columns; intent is rescaled to (0,1] so no agent is exactly zero. Beta(2,2) is
  # symmetric with mean 0.5, which is what makes a separating threshold a curve
  # rather than a step. Drawn on a separate engine stream, so changing any of these
  # leaves the four trait columns bit-identical.
  intent_beta_a: 2.0
  intent_beta_b: 2.0
  values_beta_a: 2.0
  values_beta_b: 2.0
  # Share of agents eligible for the Environment B subgraph. A probability so the
  # subgraph scales with N; the real entry filter is g_min (THEORY.md §10.3).
  community_prob: 0.5
  traits:
    status:
      dist: lognormal
      mean: 0.0
      std: 0.8
    attractiveness:
      dist: normal
      mean: 0.5
      std: 0.15
    sociability:
      dist: normal
      mean: 0.5
      std: 0.15
    age:
      dist: normal
      mean: 30.0
      std: 6.0

# Traits are z-scored before entering the utility (docs/THEORY.md §2), so every
# weight below is expressed against a unit-variance trait and delta is measured in
# standard deviations of log-status. delta=1.0 means "one population sd above her
# own status", not "one raw log-status unit".
hypergamy:
  delta: 0.5       # status surplus threshold delta, in standardized-status sd
  alpha: 1.0       # status weight — the dominant linear term (Matthew effect)
  # beta=2.0 rather than 0.8. Measured top-1000 overlap between delta=0.0 and
  # delta=1.0 at the old weights (alpha=1.0, beta=0.8) was 0.9661: delta barely
  # moved the shortlist, because a status-dominated utility makes the indicator a
  # constant across almost all of it. At alpha=1.0, beta=2.0 the overlap is
  # 0.7615, so delta reorders about a quarter of a 20-item shortlist while status
  # stays the dominant linear term. Rule of thumb: delta has real power when
  # beta/alpha >= 2. Guarded by tests/cpp/test_delta_power.cpp.
  beta: 2.0        # attractiveness weight
  gamma: 0.3       # distance penalty weight
  lambda: 1.5      # indicator bonus for status surplus
  # Persistent pairwise "chemistry" (THEORY.md §2.3): a logistic shock with this
  # standard deviation added to every ordered pair's utility. In ABSOLUTE utility
  # units, not a ratio — the orchestrator logs the implied noise-to-signal ratio
  # (shock_scale * 1.8138 / utility_sd) at construction, because retuning alpha or
  # beta changes what a fixed shock_scale means. 0 skips the term entirely.
  #
  # 1.5 against the noise-free utility sd measured at these weights (~2.75 with
  # taste_sigma 0.5, ~2.40 without) is a ratio near 1.0, but that figure is
  # measured at runtime rather than asserted here.
  shock_scale: 1.5
  # Signalling cost c (THEORY.md §10.2): what a proposal costs its proposer, spent
  # rather than disliked. Never enters utility_toward, so it changes no welfare
  # number by itself. 0.0 is the pooling regime — every admissible type proposes —
  # and reproduces every pre-session result bit for bit.
  #
  # Its meaningful range is set by the utilities it is compared against, which at
  # these weights are of order 4: a cost below ~0.08 binds on nothing at all. The
  # market closes at c >= tau_max * Vbar * p, measured at ~2.07 (M) and ~2.47 (W)
  # with p = 0.5. See THEORY.md §10.2 for the table.
  signal_cost: 0.0

# Environment B: the constrained subgraph (THEORY.md §10.3, §10.5). Read only by the
# "complete" recommender arm and by environment_b.py; Environment A ignores it, so
# every A-side number is unchanged by this block being present.
environment_b:
  # Share of each side drawn into the pool, before the values_min filter and before
  # side-balancing — so |B| is at most size_fraction * N and is reported, not assumed.
  size_fraction: 0.5
  # Entry filter on values g. Beta(2,2) puts 78% of agents at or above 0.3.
  values_min: 0.3
  # c_B, which must exceed Environment A's hypergamy.signal_cost (0.0). 0.25 is in the
  # partially-separating range of THEORY.md §10.2: it removes ~1% of proposals, so
  # B's clearance is not dominated by the cost.
  signal_cost: 0.25
  # d: welfare charged to the defector. Prices defection; does not change survival.
  defection_penalty: 0.5
  # sigma_ij = sigma_0 * (tau_i tau_j)^sigma_alpha * g_ij^sigma_beta, with g_ij the
  # pairwise alignment 1 - |g_i - g_j|. No empirical anchor for any of these four:
  # modeling knobs, reported as such.
  sigma_0: 1.0
  sigma_alpha: 0.5
  sigma_beta: 0.5
  # L in the partner's loss L * (1 - tau_defector).
  partner_loss: 1.0

ncf:
  embed_dim: 64
  mlp_layers: [128, 64, 32]
  lr: 0.001
  l2_reg: 0.00001
  pos_weight: 4.0
  top_k: 20
  # Negatives per positive in the swipe log. Threaded through generate_swipes via
  # config["ncf"]["n_negatives"]; defaults to 4 when absent. Changing it changes
  # NCF training hardness, which is the point — it is a sweep knob.
  n_negatives: 4

simulation:
  n_epochs: 100
  bayesian_eta: 0.1
  n_generations: 5
  turnover_fraction: 0.2   # bottom fraction replaced each generation
  # Exogenous drift of W's status, THEORY.md §10.6: s_w(t) = s_w(0) + gamma*t, gamma in
  # epoch-0 population status sd per epoch, applied from epoch 1. 0.0 is the no-drift cell;
  # scripts/run_institutional.py switches it on (--gamma, default 0.02) for the factorial.
  status_drift: 0.0

output:
  dir: data/processed/
  save_every: 10           # checkpoint model every N epochs

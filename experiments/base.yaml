population:
  n: 1000
  seed: 42
  # Share of candidates an agent finds admissible at epoch 0. θ is calibrated per
  # agent as the (1 - admissible_fraction) quantile of that agent's own utilities,
  # so this is a target, not a cutoff — see docs/INTERFACES.md §2 and THEORY.md §3.
  admissible_fraction: 0.2
  traits:
    status:
      dist: lognormal
      mean: 0.0
      std: 0.8
    attractiveness:
      dist: normal
      mean: 0.5
      std: 0.15
    sociability:
      dist: normal
      mean: 0.5
      std: 0.15
    age:
      dist: normal
      mean: 30.0
      std: 6.0

# Traits are z-scored before entering the utility (docs/THEORY.md §2), so every
# weight below is expressed against a unit-variance trait and delta is measured in
# standard deviations of log-status. delta=1.0 means "one population sd above her
# own status", not "one raw log-status unit".
hypergamy:
  delta: 0.5       # status surplus threshold delta, in standardized-status sd
  alpha: 1.0       # status weight — the dominant linear term (Matthew effect)
  # beta=2.0 rather than 0.8. Measured top-1000 overlap between delta=0.0 and
  # delta=1.0 at the old weights (alpha=1.0, beta=0.8) was 0.9661: delta barely
  # moved the shortlist, because a status-dominated utility makes the indicator a
  # constant across almost all of it. At alpha=1.0, beta=2.0 the overlap is
  # 0.7615, so delta reorders about a quarter of a 20-item shortlist while status
  # stays the dominant linear term. Rule of thumb: delta has real power when
  # beta/alpha >= 2. Guarded by tests/cpp/test_delta_power.cpp.
  beta: 2.0        # attractiveness weight
  gamma: 0.3       # distance penalty weight
  lambda: 1.5      # indicator bonus for status surplus

ncf:
  embed_dim: 64
  mlp_layers: [128, 64, 32]
  lr: 0.001
  l2_reg: 0.00001
  pos_weight: 4.0
  top_k: 20
  # Negatives per positive in the swipe log. Threaded through generate_swipes via
  # config["ncf"]["n_negatives"]; defaults to 4 when absent. Changing it changes
  # NCF training hardness, which is the point — it is a sweep knob.
  n_negatives: 4

simulation:
  n_epochs: 100
  bayesian_eta: 0.1
  n_generations: 5
  turnover_fraction: 0.2   # bottom fraction replaced each generation

output:
  dir: data/processed/
  save_every: 10           # checkpoint model every N epochs

[pytest]
# Registers the markers this suite uses. Without this block pytest still honours
# `-m "not slow"` — the selection works off the marker name either way — but it
# emits a PytestUnknownMarkWarning for each marked file, which is the kind of
# noise that trains a reader to ignore the warnings summary.
markers =
    slow: statistical property tests; several full simulations each, excluded from the default CI run

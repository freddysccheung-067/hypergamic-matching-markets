name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.4.8
      - run: ruff check src/python/ scripts/ tests/python/

  test-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU wheel: the default Linux torch wheel pulls gigabytes of CUDA libraries
      - run: pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt

      # the tests import the compiled extension, so build it first
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Build extension
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # slow property tests are excluded from the default run
      - name: Run pytest
        shell: bash
        run: pytest tests/python/ -v --tb=short -rfE -m "not slow" 2>&1 | tee pytest.log
      - name: Diag
        if: always()
        shell: bash
        run: |
          export PYTHONPATH=build:tests/python
          python .github/ci_diag.py 2>&1 | sed -n '/^shape/,$p' | cut -c1-170 | python .github/ci_diag_emit.py
          echo "::notice::numpy $(python -c 'import numpy;print(numpy.__version__)') nproc $(nproc)"
      # TEMPORARY: surface the failure summary as public annotations
      - name: Annotate failures
        if: always()
        run: |
          echo "::notice::cpu: $(grep -m1 'model name' /proc/cpuinfo)"
          grep -E "^(FAILED|ERROR) |=+ .*(passed|failed|error)" pytest.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:480}"; done

  test-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libpython3-dev python3-pybind11

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/cpp/**', 'include/**') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log
      # TEMPORARY diagnostics
      - name: Annotate
        if: always()
        run: |
          echo "::notice::cpu: $(grep -m1 'model name' /proc/cpuinfo)"
          grep -E "Failed|FAILED|SIGILL|Illegal|\*\*\*|tests passed|REQUIRE|CHECK|with expansion|==" ctest.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:400}"; done

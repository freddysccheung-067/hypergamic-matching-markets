name: CI

on:
  push:
    branches: [main, "rev/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.4.8
      - run: ruff check src/python/ scripts/ tests/python/

  test-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU wheel: the default Linux torch wheel pulls gigabytes of CUDA libraries
      - run: pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt

      # the tests import the compiled extension, so build it first
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Build extension
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # slow property tests are excluded from the default run
      - run: pytest tests/python/ -v --tb=short -m "not slow"

  # The paper's numbers are checked, not compiled. verify.py needs no TeX: it
  # checks that every \input resolves, every \ref has a \label, every \cite has a
  # bib entry, every figure exists, every number macro used is defined and every
  # one defined is used, and that no control character or backslash-stripped
  # command crept into a source. numbers.tex must also be current with its CSVs,
  # or the committed table is stale against the data it claims to report.
  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Structural checks
        run: python paper/verify.py
      - name: Number macros are current
        run: |
          python paper/gen_numbers.py
          python paper/tables.py
          git diff --exit-code paper/tables/ || {
            echo "::error::paper/tables is stale; run paper/gen_numbers.py and paper/tables.py"
            exit 1
          }

  test-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libpython3-dev python3-pybind11

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/cpp/**', 'include/**') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
